appName: immich
services:
  server:
    image: ghcr.io/immich-app/immich-server:release
    environment:
      DB_HOSTNAME: db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
    volumes:
      - immich-upload:/data
    depends_on:
      - db
      - redis
    nethera:
      public: 2283       # exposes this service's port 2283 over the public HTTPS endpoint
      auth: login         # protects first admin setup behind Nethera login
      preferLan: true     # redirects same-network traffic to the local address when possible

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    volumes:
      - immich-model-cache:/cache

  redis:
    image: valkey/valkey:9

  db:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - immich-db:/var/lib/postgresql/data

volumes:
  immich-upload:
  immich-model-cache:
  immich-db:
